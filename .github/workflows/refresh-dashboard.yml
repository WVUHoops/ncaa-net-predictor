name: Refresh dashboard

on:
  schedule:
    # 6:00 AM Eastern during daylight saving time; 5:00 AM Eastern during standard time.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      skip_network:
        description: "Reuse cached inputs and skip live On3 fetches"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    env:
      CBB_ANALYTICS_API_KEY: ${{ secrets.CBB_ANALYTICS_API_KEY }}
      KENPOM_API_TOKEN: ${{ secrets.KENPOM_API_TOKEN }}
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: ncaa-net-data-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ncaa-net-data-v2-${{ runner.os }}-

      - name: Ensure output directories exist
        run: |
          mkdir -p dashboard
          mkdir -p data/raw data/processed

      - name: Refresh dashboard
        run: |
          if [ "${{ inputs.skip_network }}" = "true" ]; then
            python3 scripts/update_dashboard.py --skip-network
          else
            python3 scripts/update_dashboard.py
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-net-dashboard
          path: |
            dashboard/index.html
            dashboard/dashboard_payload.json
          retention-days: 30

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html dashboard/dashboard_payload.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Refresh NCAA NET dashboard"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
