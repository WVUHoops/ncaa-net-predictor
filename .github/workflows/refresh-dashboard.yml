name: Refresh dashboard

on:
  schedule:
    # 6:00 AM Eastern during daylight saving time; 5:00 AM Eastern during standard time.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      skip_network:
        description: "Reuse cached inputs and skip live On3 fetches"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    env:
      CBB_ANALYTICS_API_KEY: ${{ secrets.CBB_ANALYTICS_API_KEY }}
      CBB_EMAIL: ${{ secrets.CBB_EMAIL }}
      CBB_PASSWORD: ${{ secrets.CBB_PASSWORD }}
      CBB_AUTH_TOKEN: ${{ secrets.CBB_AUTH_TOKEN }}
      CBB_TRANSFER_AUTHORIZATION: ${{ secrets.CBB_TRANSFER_AUTHORIZATION }}
      CBB_TRANSFER_COOKIE: ${{ secrets.CBB_TRANSFER_COOKIE }}
      CBB_TRANSFER_CSV_URL: ${{ secrets.CBB_TRANSFER_CSV_URL }}
      CBB_TRANSFER_REFERER: ${{ secrets.CBB_TRANSFER_REFERER }}
      KENPOM_API_TOKEN: ${{ secrets.KENPOM_API_TOKEN }}
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed/on3_features
            data/processed/coach_features
            data/processed/roster_status
            data/processed/transfer_features
            data/processed/predictions
          key: ncaa-net-data-v4-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ncaa-net-data-v4-${{ runner.os }}-

      - name: Ensure output directories exist
        run: |
          mkdir -p dashboard
          mkdir -p data/raw data/processed
          mkdir -p data/raw/cbb_analytics/transfer_portal/current

      - name: Download CBB transfer portal CSV
        if: ${{ env.CBB_TRANSFER_CSV_URL != '' || env.CBB_EMAIL != '' || env.CBB_AUTH_TOKEN != '' }}
        run: |
          python3 scripts/fetch_cbb_transfer_portal_csv.py

      - name: Refresh dashboard
        run: |
          if [ "${{ inputs.skip_network }}" = "true" ]; then
            python3 scripts/update_dashboard.py --skip-network
          else
            python3 scripts/update_dashboard.py
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-net-dashboard
          path: |
            dashboard/index.html
            dashboard/dashboard_payload.json
          retention-days: 30

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dashboard/index.html \
            dashboard/dashboard_payload.json \
            data/raw/on3/hs/2026 \
            data/raw/on3/hs_commits/2026 \
            data/raw/on3/transfer/2026 \
            data/raw/hoopdirt/coaching_changes \
            data/raw/cbb_analytics/transfer_portal/current \
            data/raw/cbb_analytics/v1/player-agg-box/stats_player_agg_box_competition_41097_v1_2026-04-13.csv \
            data/raw/cbb_analytics/v1/player-agg-box/stats_player_agg_box_competition_41097_v1_2026-04-13.json \
            data/raw/cbb_analytics/v1/competition-team-players/competition_team_players_competition_41097_v1_2026-04-13.csv \
            data/raw/cbb_analytics/v1/competition-team-players/competition_team_players_competition_41097_v1_2026-04-13.json \
            data/processed/on3_features/on3_incoming_talent_features.csv \
            data/processed/on3_features/on3_incoming_talent_features.json \
            data/processed/on3_features/on3_hs_recruit_players.csv \
            data/processed/on3_features/on3_hs_recruit_players.json \
            data/processed/roster_status/player_roster_status_2026.csv \
            data/processed/roster_status/player_roster_status_2026.json \
            data/processed/roster_status/team_roster_summary_2026.csv \
            data/processed/roster_status/team_roster_summary_2026.json \
            data/processed/transfer_features/current \
            data/processed/predictions/current_2027_schedule_predictions.csv \
            data/processed/predictions/current_2027_schedule_predictions.json \
            data/processed/upset_risk/current_2027_guarantee_risk_board.csv \
            data/processed/upset_risk/model_coefficients.csv \
            data/processed/upset_risk/rolling_metrics.csv
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Refresh NCAA NET dashboard"
            git reset --hard HEAD
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main || (
              git fetch origin main &&
              git rebase origin/main &&
              git push origin HEAD:main
            )
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
